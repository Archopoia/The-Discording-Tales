<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Scene lab | THE DISCORDING TALES</title>
  <meta name="description" content="Local test: council scene layered hover (origins / peoples)."/>
  <link rel="canonical" href="https://www.thediscordingtales.com/scene-lab/"/>
  <meta content="#5a1f1f" name="theme-color"/>
  <link href="https://www.thediscordingtales.com/assets/icons/favicon-48x48.png" rel="icon" type="image/png" sizes="48x48"/>
  <link href="https://www.thediscordingtales.com/favicon.ico" rel="icon" sizes="48x48"/>
  <style>
    @font-face {
      font-family: "Dauphin";
      font-style: normal;
      font-weight: 400;
      src: url("../assets/Fonts/DauphinRegular.ttf") format("truetype");
      font-display: swap;
    }
    @font-face {
      font-family: "Mystic Cards";
      font-style: normal;
      font-weight: 400;
      src: url("../assets/Fonts/MysticCards.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --bg: #0a0607;
      --ink: #f3e6d8;
      --muted: #a89482;
      --gold: #e8c97a;
      --line: rgba(232, 201, 122, 0.35);
      --callout-bg: rgba(34, 18, 16, 0.92);
      --callout-ink: #f6edd4;
      --callout-muted: #c9b4a0;
      --callout-border: rgba(232, 201, 122, 0.72);
      /* People bubble: sampled lightest hover glow yellow + dark reddish ink */
      --people-callout-bg: rgba(254, 254, 223, 0.88);
      --people-callout-ink: #4a1c1a;
      --people-callout-muted: #5a2a26;
      --people-callout-border: rgba(254, 254, 223, 0.55);
      --people-callout-name: #5a1f1f;
      --font-display: "Mystic Cards", Palatino, Georgia, serif;
      --font-body: "Dauphin", Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(900px 480px at 50% 0%, #2a1416, var(--bg));
      color: var(--ink);
      font-family: var(--font-body);
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: baseline;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--line);
      background: rgba(10, 6, 7, 0.85);
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(8px);
    }
    .bar a { color: var(--gold); text-decoration: none; }
    .bar a:hover { text-decoration: underline; }
    .bar .brand {
      font-family: var(--font-display);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--ink);
    }
    .bar .hint { color: var(--muted); font-size: 0.9rem; }
    .bar .hit {
      margin-left: auto;
      min-height: 1.25em;
      color: var(--gold);
      font-family: var(--font-display);
      letter-spacing: 0.04em;
    }
    .stage-wrap {
      padding: 1rem 1.25rem 2.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 2058 / 1100;
      background: #000;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      cursor: crosshair;
      touch-action: none;
      user-select: none;
      /* 1 ≈ 960px stage; JS keeps callout type/padding in proportion */
      --callout-scale: 1;
    }
    .stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      /* Stage keeps the scene aspect ratio; contain avoids any stretch. */
      object-fit: contain;
      object-position: center center;
      pointer-events: none;
      display: block;
    }
    .stage .base { z-index: 0; transition: filter 0.9s ease; }
    .stage .base.is-soft,
    .stage .layer__art.is-soft,
    .stage .layer__glow.is-soft,
    .stage .overlay.is-soft { filter: blur(10px); }
    .stage .base.is-medium,
    .stage .base.is-full,
    .stage .layer__art.is-full,
    .stage .layer__glow.is-full,
    .stage .overlay.is-medium,
    .stage .overlay.is-full { filter: none; }
    /* Hover people/origins; each layer masks out table+woman so art+glow stay behind them */
    .stage .hover-stack {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    /* Foreground plates: always above hover layers, always below callouts/SVG */
    .stage .overlay {
      opacity: 0.5;
      z-index: 30;
      pointer-events: none;
    }
    .stage .overlay--table { z-index: 30; }
    .stage .overlay--woman { z-index: 31; }
    .stage .layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      z-index: var(--z, 1);
      transition: opacity 120ms ease;
      pointer-events: none;
    }
    .stage .layer--origin {
      z-index: var(--z, 1);
    }
    .stage .layer--person {
      z-index: var(--z, 10);
    }
    .stage .layer.is-lit {
      opacity: 1;
    }
    .stage .layer__art,
    .stage .layer__glow {
      /* table/woman punch */
      -webkit-mask-image: var(--occluder-mask);
      mask-image: var(--occluder-mask);
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-source-type: alpha;
      mask-mode: alpha;
    }
    .stage .layer.is-lit .layer__art {
      filter: brightness(1.1) saturate(1.12);
    }
    /* Glow duplicate: only top ~67% (no bottom-edge / bottom-third shine) */
    .stage .layer__glow {
      opacity: 0;
      -webkit-mask-image:
        var(--occluder-mask),
        linear-gradient(to bottom, #000 0%, #000 62%, transparent 72%);
      mask-image:
        var(--occluder-mask),
        linear-gradient(to bottom, #000 0%, #000 62%, transparent 72%);
      -webkit-mask-composite: source-in;
      mask-composite: intersect;
      -webkit-mask-size: 100% 100%, 100% 100%;
      mask-size: 100% 100%, 100% 100%;
      transition: opacity 120ms ease;
    }
    .stage .layer.is-lit .layer__glow {
      opacity: 1;
      filter:
        drop-shadow(0 0 10px rgba(245, 222, 179, 0.55))
        drop-shadow(0 0 28px rgba(245, 222, 179, 0.65))
        drop-shadow(0 0 56px rgba(255, 235, 198, 0.45))
        drop-shadow(0 0 96px rgba(255, 248, 240, 0.28));
      animation: solarShine 1.8s ease-in-out infinite alternate;
    }
    @keyframes solarShine {
      0% {
        filter:
          drop-shadow(0 0 8px rgba(245, 222, 179, 0.45))
          drop-shadow(0 0 22px rgba(245, 222, 179, 0.5))
          drop-shadow(0 0 44px rgba(255, 235, 198, 0.32))
          drop-shadow(0 0 72px rgba(255, 248, 240, 0.18));
      }
      100% {
        filter:
          drop-shadow(0 0 14px rgba(255, 245, 220, 0.75))
          drop-shadow(0 0 36px rgba(245, 222, 179, 0.8))
          drop-shadow(0 0 72px rgba(255, 235, 198, 0.55))
          drop-shadow(0 0 120px rgba(255, 248, 240, 0.35));
      }
    }

    .stage-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
      overflow: visible;
    }
    .stage-svg .connector {
      fill: none;
      stroke: var(--people-callout-border);
      stroke-width: 1.5;
      stroke-linecap: round;
      opacity: 0;
      transition: opacity 140ms ease;
    }
    .stage-svg .connector.is-on { opacity: 1; }

    /*
      Callouts scale with the stage (--callout-scale from JS), not the phone viewport.
      Tuned at scale=1 ≈ 960px stage width so bubbles stay a fraction of the scene.
    */
    .callout {
      position: absolute;
      z-index: 50;
      width: min(calc(270px * var(--callout-scale)), 34%);
      max-height: min(calc(220px * var(--callout-scale)), 42%);
      padding:
        calc(0.7rem * var(--callout-scale))
        calc(0.85rem * var(--callout-scale))
        calc(0.8rem * var(--callout-scale));
      background: var(--callout-bg);
      color: var(--callout-ink);
      border: 1.5px solid var(--callout-border);
      border-radius: 2px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      overflow: hidden;
    }
    /* People: rect plate + 4-edge mask feather (this dissolve actually kills the rim) */
    .callout:not(.callout--origin) {
      width: min(calc(440px * var(--callout-scale)), 48%);
      max-height: min(calc(300px * var(--callout-scale)), 52%);
      background: var(--people-callout-bg);
      color: var(--people-callout-ink);
      border: none;
      border-radius: 0;
      padding:
        calc(1.7rem * var(--callout-scale))
        calc(1.85rem * var(--callout-scale))
        calc(1.75rem * var(--callout-scale));
      text-align: left;
      box-shadow: none;
      transform: none;
      transition:
        opacity 420ms ease,
        visibility 0s linear 420ms;
      /* Soft rim only: solid core ~84% so copy stays on clear plate */
      -webkit-mask-image:
        linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, #000 10%, #000 90%, transparent 100%);
      mask-image:
        linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, #000 10%, #000 90%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-composite: intersect;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
    }
    .callout:not(.callout--origin).is-on {
      opacity: 1;
      visibility: visible;
      transition:
        opacity 420ms ease,
        visibility 0s linear 0s;
    }
    .callout:not(.callout--origin) .callout__name {
      color: var(--people-callout-name);
      margin-bottom: calc(0.35rem * var(--callout-scale));
      white-space: nowrap;
    }
    .callout:not(.callout--origin) .callout__body {
      color: var(--people-callout-muted);
    }
    /* Origin: same borderless edge feather as the people cards. Wipe still opens toward the right. */
    .callout--origin {
      z-index: 55;
      left: 10px;
      top: 10px;
      width: min(calc(420px * var(--callout-scale)), 44%);
      max-height: min(calc(280px * var(--callout-scale)), 50%);
      transform: none;
      opacity: 0;
      clip-path: inset(0 100% 0 0);
      border: none;
      border-radius: 0;
      box-shadow: none;
      padding:
        calc(1.7rem * var(--callout-scale))
        calc(1.85rem * var(--callout-scale))
        calc(1.75rem * var(--callout-scale));
      -webkit-mask-image:
        linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, #000 10%, #000 90%, transparent 100%);
      mask-image:
        linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, #000 10%, #000 90%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-composite: intersect;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      transition:
        clip-path 620ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 220ms ease,
        visibility 0s linear 620ms;
    }
    .callout--origin.is-on {
      opacity: 1;
      visibility: visible;
      clip-path: inset(0 0 0 0);
      transition:
        clip-path 620ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 200ms ease,
        visibility 0s linear 0s;
    }
    @media (prefers-reduced-motion: reduce) {
      .callout:not(.callout--origin),
      .callout:not(.callout--origin).is-on,
      .callout--origin,
      .callout--origin.is-on {
        transition: opacity 1ms linear, visibility 0s linear 0s, clip-path 1ms linear !important;
      }
      .callout--origin {
        clip-path: inset(0 0 0 0);
      }
    }
    .callout--origin .callout__kicker {
      margin: 0 0 calc(0.18rem * var(--callout-scale));
      font-family: var(--font-body);
      font-size: calc(0.72rem * var(--callout-scale));
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--callout-muted);
    }
    .callout__name {
      margin: 0 0 calc(0.3rem * var(--callout-scale));
      font-family: var(--font-display);
      font-size: calc(1.15rem * var(--callout-scale));
      font-weight: 400;
      letter-spacing: 0.03em;
      color: var(--gold);
    }
    .callout__body {
      margin: 0;
      font-family: var(--font-body);
      font-size: calc(0.92rem * var(--callout-scale));
      line-height: 1.4;
      color: var(--callout-muted);
    }

    .status { margin-top: 0.85rem; color: var(--muted); font-size: 0.92rem; }
    .status strong { color: var(--ink); }
    .loadbar {
      position: absolute;
      left: 22%;
      right: 22%;
      bottom: 7%;
      height: 2px;
      z-index: 40;
      background: rgba(232, 201, 122, 0.28);
      pointer-events: none;
      transition: opacity .45s ease;
    }
    .loadbar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--gold);
    }
    .loadbar.is-done { opacity: 0; }
    html.embed .bar { display: none; }
    html.embed, html.embed body {
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    html.embed .stage-wrap {
      height: 100%;
      padding: 0;
      max-width: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    html.embed .stage {
      /* Keep scene aspect; letterbox inside the iframe if needed - never stretch. */
      width: 100%;
      height: auto;
      max-height: 100%;
      aspect-ratio: 2058 / 1100;
      border: 0;
      box-shadow: none;
      background: transparent;
    }
    html.embed .status { display: none; }
    html.embed .status.is-error { display: block; text-align: center; }

    /* Standalone immersive (direct /scene-lab/ visit) */
    .stage-wrap.is-immersive {
      position: fixed;
      inset: 0;
      z-index: 40;
      max-width: none;
      padding: 0;
      margin: 0;
      background: #050303;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage-wrap.is-immersive .stage {
      width: min(100vw, calc(100vh * 2058 / 1100));
      height: min(100vh, calc(100vw * 1100 / 2058));
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 2058 / 1100;
      border: 0;
      box-shadow: none;
      border-radius: 0;
    }
    .scene-lab-close {
      position: fixed;
      top: max(0.65rem, env(safe-area-inset-top, 0px));
      right: max(0.65rem, env(safe-area-inset-right, 0px));
      z-index: 50;
      width: 2.6rem;
      height: 2.6rem;
      border: 1px solid rgba(232, 201, 122, 0.45);
      border-radius: 999px;
      background: rgba(18, 8, 8, 0.72);
      color: #f3e6d8;
      font-size: 1.65rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .scene-lab-rotate-hint {
      position: fixed;
      left: 50%;
      bottom: max(1.25rem, env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 50;
      margin: 0;
      padding: 0.55rem 0.95rem;
      max-width: min(22rem, 92vw);
      text-align: center;
      font-size: 0.92rem;
      color: #f3e6d8;
      background: rgba(18, 8, 8, 0.78);
      border: 1px solid rgba(232, 201, 122, 0.4);
      border-radius: 999px;
      pointer-events: none;
    }
    html.scene-lab-local-immersive,
    html.scene-lab-local-immersive body { overflow: hidden; }
  </style>
</head>
<body>
  <script>
    if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
  </script>
  <div class="bar">
    <a class="brand" href="../index.html">TDT</a>
    <span class="hint">Scene lab - hover people or empty space near an origin</span>
    <div class="hit" id="hit-label">-</div>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage" aria-label="Council scene interactive layers">
      <img class="base is-soft" src="../assets/images/image/image1_lqip.webp" data-src-medium="../assets/images/image/image1_medium.webp" data-src-full="../assets/images/image/image1.webp" alt="Full council scene" width="2058" height="1100" decoding="async"/>
      <div class="hover-stack" id="hover-stack" aria-hidden="true"></div>
      <img class="overlay overlay--table is-soft" src="../assets/images/Scene/Scene_0002s_0000s_0003_TABLE_lqip.webp" data-src-medium="../assets/images/Scene/Scene_0002s_0000s_0003_TABLE_medium.webp" data-src-full="../assets/images/Scene/Scene_0002s_0000s_0003_TABLE.webp" alt="" width="6191" height="3307" decoding="async" draggable="false" aria-hidden="true"/>
      <img class="overlay overlay--woman is-soft" src="../assets/images/Scene/Scene_0001s_0000_woman_lqip.webp" data-src-medium="../assets/images/Scene/Scene_0001s_0000_woman_medium.webp" data-src-full="../assets/images/Scene/Scene_0001s_0000_woman.webp" alt="" width="6191" height="3307" decoding="async" draggable="false" aria-hidden="true"/>
      <svg class="stage-svg" id="stage-svg" aria-hidden="true">
        <line class="connector" id="connector" x1="0" y1="0" x2="0" y2="0"/>
      </svg>
      <aside class="callout callout--origin" id="origin-callout" aria-hidden="true">
        <p class="callout__kicker" id="origin-kicker"></p>
        <h2 class="callout__name" id="origin-name"></h2>
        <p class="callout__body" id="origin-body"></p>
      </aside>
      <aside class="callout" id="callout" aria-hidden="true">
        <h2 class="callout__name" id="callout-name"></h2>
        <p class="callout__body" id="callout-body"></p>
      </aside>
      <div class="loadbar" id="loadbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading the scene">
        <span id="loadbar-fill"></span>
      </div>
    </div>
    <p class="status" id="status"></p>
  </div>

  <script type="module">
    /* Legacy codenames → current peoples (see tdt-legacy-people-names). Hooks from parade + race lore. */
    const ORIGINS = [
      {
        id: 'yums',
        memberIds: ['aristois', 'greyscribes', 'navillis', 'meridians'],
        labelEn: 'Yums',
        labelFr: 'Yômmes',
        kickerEn: 'Origin',
        kickerFr: 'Origine',
        blurbEn: 'They see the Yors as mad enough to lock away, and the Beingsts as vermin to purge.',
        blurbFr: 'Ils voient les Yôrres assez fous pour les enfermer, et les Bêstres comme de la vermine à purger.',
        src: '../assets/images/Scene/Yums.webp',
      },
      {
        id: 'yors',
        memberIds: ['great-ylves', 'pale-ylves', 'lake-ylves', 'iqqars'],
        labelEn: 'Yors',
        labelFr: 'Yôrres',
        kickerEn: 'Origin',
        kickerFr: 'Origine',
        blurbEn: 'They see the Yums as food to hunt, and the Beingsts as resources to extract.',
        blurbFr: 'Ils voient les Yômmes comme de la nourriture à chasser, et les Bêstres comme des ressources à extraire.',
        src: '../assets/images/Scene/Yors.webp',
      },
      {
        id: 'beingsts',
        memberIds: ['tchalkchais', 'slaadeans'],
        labelEn: 'Beingsts',
        labelFr: 'Bêstres',
        kickerEn: 'Origin',
        kickerFr: 'Origine',
        blurbEn: 'They see the Yums as tools to enslave, and the Yors as total aliens.',
        blurbFr: 'Ils voient les Yômmes comme des outils à asservir, et les Yôrres comme des aliens totaux.',
        src: '../assets/images/Scene/Beingsts.webp',
      },
    ];

    /* Yum subtypes (tree order): Aristese→Ghnomes, Greyscribes→Dwuars/Naims, Navillis→Hoppyts, Meridians→Halvlyns/Halvelyns. No subtype for Yors/Beingsts. */
    const PEOPLE = [
      {
        id: 'aristois',
        originId: 'yums',
        labelEn: 'Aristese',
        labelFr: 'Aristois',
        subtypeEn: 'Ghnomes',
        subtypeFr: 'Ghnomes',
        blurbEn: 'Title-starved aristocrats. They breed like rabbits so the law can colonize every floral, wind-blown plateau, and they plant sculpted palaces on gigantic star-shaped mastodons. If your children will not recite the statute, they steal them and raise them in it.',
        blurbFr: 'Aristocrates affamés de titre. Ils se reproduisent comme des lapins pour que la loi colonise chaque plateau floral battu par le vent, et plantent des palais sculptés sur d\'immenses mastodontes en forme d\'étoiles. Si vos enfants refusent le décret, on les enlève et on les élève dedans.',
        src: '../assets/images/Scene/Lighter/Scene_0002s_0000s_0000_Aristois_Light.webp',
        maskSrc: '../assets/images/Scene/Scene_0002s_0000s_0000_Aristois.webp',
      },
      {
        id: 'greyscribes',
        originId: 'yums',
        labelEn: 'Greyscribes',
        labelFr: 'Griscribes',
        subtypeEn: 'Dwuars',
        subtypeFr: 'Naims',
        blurbEn: 'Knowledge, and they will pay in you. Opened alive, studied, then your skin goes on the wall so they can read through it. Hanging tents in the cold fog of the mangroves, slug-caravans on the roads, and the creed is simple: everything can be bought. Everything has a price.',
        blurbFr: 'Le savoir, et ils paient avec vous. Ouverts vifs, étudiés, puis votre peau au mur pour qu\'ils lisent à travers. Tentes suspendues dans le froid brumeux des mangroves, caravanes-limaces sur les routes, et le credo est simple : tout s\'achète. Tout a un prix.',
        src: '../assets/images/Scene/Lighter/Scene_0002s_0000s_0001_Greyscribes_Light.webp',
        maskSrc: '../assets/images/Scene/Scene_0002s_0000s_0001_Greyscribes.webp',
      },
      {
        id: 'iqqars',
        originId: 'yors',
        labelEn: 'Iqqars',

    const lang = (new URLSearchParams(location.search).get('lang') || 'en').toLowerCase().startsWith('fr')

    const ALPHA_THRESHOLD = 24;
    const MASK_SCALE = 0.2;
    const OCCLUDER_MASK_SCALE = 0.35;
    const STAGE_PAD = 10;
    const GAP = 18;
    /* Callout typography/padding designed around this stage width */
    const CALLOUT_REF_WIDTH = 960;
    const ORIGIN_PAD_X = 0.03;
    const ORIGIN_PAD_TOP = 0.08;

    /** @type {{ id: string, originId: string, label: string, blurb: string, el: HTMLImageElement, alpha: Uint8Array, mw: number, mh: number, bounds: object }[]} */
    const runtime = [];
    /** @type {{ id: string, label: string, kicker: string, blurb: string, memberIds: string[], bounds: object|null, el: HTMLImageElement, alpha: Uint8Array, mw: number, mh: number }[]} */
    const originRuntime = [];

    function peopleLabel(meta) {
      const name = lang === 'fr' ? meta.labelFr : meta.labelEn;
      const subtype = lang === 'fr' ? meta.subtypeFr : meta.subtypeEn;
      return subtype ? `${name} - (${subtype})` : name;

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.decoding = 'async';
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('Failed to load ' + src));
        img.src = src;
      });
    }

    /** Keep callout text/padding proportional to the rendered scene, not the phone CSS px. */
    function syncCalloutScale() {
      if (!stage) return;
      const w = stage.clientWidth || CALLOUT_REF_WIDTH;
      /* Allow wider immersive plates; was 1.2 → ~360px even on 1080p+ */
      const scale = Math.min(1.55, Math.max(0.38, w / CALLOUT_REF_WIDTH));
      stage.style.setProperty('--callout-scale', scale.toFixed(3));
      const pad = Math.max(4, Math.round(10 * scale));
      stage.style.setProperty('--callout-pad', pad + 'px');
    }

    /** LQIP → medium → full for the base plate (same pattern as entrance / geo). */
    function upgradeBaseArt() {
      const base = stage?.querySelector('img.base');
      if (!base) return;
      const medium = base.getAttribute('data-src-medium');
      const full = base.getAttribute('data-src-full');
      const apply = (url, cls) => loadImage(url).then((decoded) => {
        base.src = decoded.src;
        base.classList.add(cls);
        base.classList.remove('is-soft');
      }).catch(() => {});
      const chain = medium ? apply(medium, 'is-medium') : Promise.resolve();
      chain.then(() => {
        if (full) return apply(full, 'is-full');
      });
    }
    upgradeBaseArt();
    document.querySelectorAll('.stage img.overlay[data-src-medium]').forEach((el) => {
      const medium = el.getAttribute('data-src-medium');
      const full = el.getAttribute('data-src-full');
      const apply = (url, cls) => loadImage(url).then((decoded) => {
        el.src = decoded.src;
        el.classList.add(cls);
        el.classList.remove('is-soft');
      }).catch(() => {});
      const chain = medium ? apply(medium, 'is-medium') : Promise.resolve();
      chain.then(() => { if (full) return apply(full, 'is-full'); });
    });

    function boundsFromAlpha(alpha, mw, mh) {
      let minX = mw;
      let minY = mh;
      let maxX = -1;
      let maxY = -1;
      let sumX = 0;
      let sumY = 0;
      let count = 0;
      for (let y = 0; y < mh; y++) {
        const row = y * mw;
        for (let x = 0; x < mw; x++) {
          if (alpha[row + x] <= ALPHA_THRESHOLD) continue;
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
          sumX += x;
          sumY += y;
          count++;
        }
      }
      if (!count) return null;
      return {
        minX: minX / mw,
        minY: minY / mh,
        maxX: (maxX + 1) / mw,
        maxY: (maxY + 1) / mh,
        cx: sumX / count / mw,
        cy: sumY / count / mh,
      };
    }

    /** White = show layer pixels; transparent = hide (under table/woman). */
    async function buildHoverOccluderMask(tableSrc, womanSrc) {
      const [tableImg, womanImg] = await Promise.all([loadImage(tableSrc), loadImage(womanSrc)]);
      const w = Math.max(1, Math.round(tableImg.naturalWidth * OCCLUDER_MASK_SCALE));
      const h = Math.max(1, Math.round(tableImg.naturalHeight * OCCLUDER_MASK_SCALE));
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'destination-out';
      // Slight expand so soft edges / glow don't leak through the plates
      const punch = (img) => {
        const ox = [0, -1, 1, 0, 0, -1, 1, -1, 1];
        const oy = [0, 0, 0, -1, 1, -1, -1, 1, 1];
        for (let i = 0; i < ox.length; i++) {
          ctx.drawImage(img, ox[i], oy[i], w, h);
        }
      };
      punch(tableImg);
      punch(womanImg);
      return canvas.toDataURL('image/png');
    }

    function applyOccluderMask(el, occluderUrl) {
      el.style.setProperty('--occluder-mask', `url("${occluderUrl}")`);
    }

    function mediumVariant(src) {
      return src.replace(/(\.webp)(\?.*)?$/i, '_medium.webp$2');
    }

    /** Art + glow twin; glow is masked to top ~2/3 so bottom has no shine.
     *  Visual layers: medium first, then full (masks stay on full assets). */
    function createHoverLayer(src, kindClass, z, occluderUrl) {
      const wrap = document.createElement('div');
      wrap.className = `layer ${kindClass}`;
      wrap.style.setProperty('--z', String(z));
      applyOccluderMask(wrap, occluderUrl);

      const art = document.createElement('img');
      art.className = 'layer__art is-soft';
      art.alt = '';
      art.draggable = false;
      art.src = mediumVariant(src);

      const glow = document.createElement('img');
      glow.className = 'layer__glow is-soft';
      glow.alt = '';
      glow.draggable = false;
      glow.setAttribute('aria-hidden', 'true');
      glow.src = mediumVariant(src);

      loadImage(src).then(() => {
        art.src = src;
        glow.src = src;
        art.classList.add('is-full');
        glow.classList.add('is-full');
        art.classList.remove('is-soft');
        glow.classList.remove('is-soft');
      }).catch(() => {});

      wrap.appendChild(art);
      wrap.appendChild(glow);
      return wrap;
    }

    function buildAlphaMask(img) {
      const mw = Math.max(1, Math.round(img.naturalWidth * MASK_SCALE));
      const mh = Math.max(1, Math.round(img.naturalHeight * MASK_SCALE));
      const canvas = document.createElement('canvas');
      canvas.width = mw;
      canvas.height = mh;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.clearRect(0, 0, mw, mh);
      ctx.drawImage(img, 0, 0, mw, mh);
      const data = ctx.getImageData(0, 0, mw, mh).data;
      const alpha = new Uint8Array(mw * mh);
      for (let i = 0, p = 3; i < alpha.length; i++, p += 4) alpha[i] = data[p];
      return { alpha, mw, mh, bounds: boundsFromAlpha(alpha, mw, mh) };
    }

    /** Fill enclosed transparent pockets inside the silhouette (not open gaps like between arms). */
    function fillAlphaInterior(alpha, mw, mh) {
      const exterior = new Uint8Array(mw * mh);
      const stack = [];
      const tryPush = (x, y) => {
        if (x < 0 || y < 0 || x >= mw || y >= mh) return;
        const i = y * mw + x;
        if (exterior[i]) return;
        if (alpha[i] > ALPHA_THRESHOLD) return;
        exterior[i] = 1;
        stack.push(i);
      };
      for (let x = 0; x < mw; x++) {
        tryPush(x, 0);
        tryPush(x, mh - 1);
      }
      for (let y = 0; y < mh; y++) {
        tryPush(0, y);
        tryPush(mw - 1, y);
      }
      while (stack.length) {
        const i = stack.pop();
        const x = i % mw;
        const y = (i / mw) | 0;
        tryPush(x + 1, y);
        tryPush(x - 1, y);
        tryPush(x, y + 1);
        tryPush(x, y - 1);
      }
      for (let i = 0; i < alpha.length; i++) {
        if (!exterior[i] && alpha[i] <= ALPHA_THRESHOLD) alpha[i] = 255;
      }
    }

    function clamp(v, lo, hi) {
      return Math.min(hi, Math.max(lo, v));
    }

    function rectsOverlap(a, b, slack) {
      const s = slack || 0;
      return !(
        a.x + a.w + s <= b.x ||
        b.x + b.w + s <= a.x ||
        a.y + a.h + s <= b.y ||
        b.y + b.h + s <= a.y
      );
    }

    function borderPointToward(rect, tx, ty) {
      const cx = rect.x + rect.w / 2;
      const cy = rect.y + rect.h / 2;
      const dx = tx - cx;
      const dy = ty - cy;
      if (dx === 0 && dy === 0) return { x: cx, y: cy };
      const hx = rect.w / 2;
      const hy = rect.h / 2;
      const scale = Math.min(
        hx / Math.max(Math.abs(dx), 1e-6),
        hy / Math.max(Math.abs(dy), 1e-6)
      );
      return { x: cx + dx * scale, y: cy + dy * scale };
    }

    function padBounds(b) {
      if (!b) return null;
      return {
        minX: clamp(b.minX - ORIGIN_PAD_X, 0, 1),
        minY: clamp(b.minY - ORIGIN_PAD_TOP, 0, 1),
        maxX: clamp(b.maxX + ORIGIN_PAD_X, 0, 1),
        maxY: clamp(b.maxY + ORIGIN_PAD_BOTTOM, 0, 1),
        cx: b.cx,
        cy: b.cy,
      };
    }

    function stagePadPx() {
      return Math.max(4, Math.round(STAGE_PAD * ((stage?.clientWidth || CALLOUT_REF_WIDTH) / CALLOUT_REF_WIDTH)));
    }

    function placeCallout(stageW, stageH, bubbleW, bubbleH, bounds, avoid) {
      const pad = stagePadPx();
      const char = {
        x: bounds.minX * stageW,
        y: bounds.minY * stageH,
        w: (bounds.maxX - bounds.minX) * stageW,
        h: (bounds.maxY - bounds.minY) * stageH,
        cx: bounds.cx * stageW,
        cy: bounds.cy * stageH,
      };

      const maxX = stageW - pad - bubbleW;
      const maxY = stageH - pad - bubbleH;

      const candidates = [
        { x: char.x + char.w + GAP, y: char.cy - bubbleH / 2, side: 'right' },
        { x: char.x - GAP - bubbleW, y: char.cy - bubbleH / 2, side: 'left' },
        { x: char.cx - bubbleW / 2, y: char.y - GAP - bubbleH, side: 'above' },
        { x: char.cx - bubbleW / 2, y: char.y + char.h + GAP, side: 'below' },
        { x: char.x + char.w + GAP, y: char.y, side: 'right-top' },
        { x: char.x - GAP - bubbleW, y: char.y, side: 'left-top' },
        { x: char.x + char.w + GAP, y: char.y + char.h - bubbleH, side: 'right-bot' },
        { x: char.x - GAP - bubbleW, y: char.y + char.h - bubbleH, side: 'left-bot' },
      ];

      let best = null;
      let bestScore = -Infinity;

      for (const c of candidates) {
        const x = clamp(c.x, pad, maxX);
        const y = clamp(c.y, pad, maxY);
        const bubble = { x, y, w: bubbleW, h: bubbleH };
        const overlapsChar = rectsOverlap(bubble, char, 6);
        const overlapsAvoid = avoid ? rectsOverlap(bubble, avoid, 8) : false;
        const dx = (x + bubbleW / 2) - char.cx;
        const dy = (y + bubbleH / 2) - char.cy;
        const dist = Math.hypot(dx, dy);
        const clampedHard =
          Math.abs(x - c.x) > 1 || Math.abs(y - c.y) > 1 ? 40 : 0;
        const score =
          (overlapsChar ? -10000 : 1000) +
          (overlapsAvoid ? -5000 : 0) -
          dist -
          clampedHard +
          (c.side.startsWith('right') || c.side.startsWith('left') ? 30 : 0);
        if (score > bestScore) {
          bestScore = score;
          best = bubble;
        }
      }

      return { bubble: best, char };
    }

    const PEOPLE_FADE_MS = 420;
    const PEOPLE_AFTER_ORIGIN_MS = 500;
    let peopleShowToken = 0;
    let peopleRevealTimer = 0;
    let pendingPersonId = null;
    let shownPersonId = null;
    let shownOriginId = null;

    function clearPeopleRevealTimer() {
      if (peopleRevealTimer) {
        window.clearTimeout(peopleRevealTimer);
        peopleRevealTimer = 0;
      }
    }

    function hidePeopleCallout() {
      peopleShowToken += 1;
      clearPeopleRevealTimer();
      pendingPersonId = null;
      shownPersonId = null;
      callout.classList.remove('is-on');
      callout.setAttribute('aria-hidden', 'true');
      connector.classList.remove('is-on');
    }

    function hideOriginCallout() {
      originCallout.classList.remove('is-on');
      originCallout.setAttribute('aria-hidden', 'true');
      shownOriginId = null;
    }

    /** @returns {{ box: {x:number,y:number,w:number,h:number}|null, opened: boolean }} */
    function layoutOriginCallout(origin) {
      if (!origin) {
        hideOriginCallout();
        return { box: null, opened: false };
      }
      const changed = shownOriginId !== origin.id;
      originKicker.textContent = origin.kicker;
      originName.textContent = origin.label;
      originBody.textContent = origin.blurb;
      // Replay L→R unroll when switching origins
      if (changed) {
        originCallout.classList.remove('is-on');
        void originCallout.offsetWidth;
        shownOriginId = origin.id;
      }
      originCallout.classList.add('is-on');
      originCallout.setAttribute('aria-hidden', 'false');
      syncCalloutScale();
      const pad = Math.max(4, Math.round(STAGE_PAD * (stage.clientWidth / CALLOUT_REF_WIDTH)));
      originCallout.style.left = pad + 'px';
      originCallout.style.top = pad + 'px';
      return {
        box: {
          x: pad,
          y: pad,
          w: originCallout.offsetWidth,
          h: originCallout.offsetHeight,
        },
        opened: changed,
      };
    }

    function paintPeopleCallout(layer, avoid) {
      syncCalloutScale();
      calloutName.textContent = layer.label;
      calloutBody.textContent = layer.blurb;
      callout.setAttribute('aria-hidden', 'false');

      callout.style.left = '0px';
      callout.style.top = '0px';
      const stageW = stage.clientWidth;
      const stageH = stage.clientHeight;
      const bubbleW = callout.offsetWidth;
      const bubbleH = callout.offsetHeight;
      const { bubble, char } = placeCallout(stageW, stageH, bubbleW, bubbleH, layer.bounds, avoid);

      callout.style.left = bubble.x + 'px';
      callout.style.top = bubble.y + 'px';

      const from = borderPointToward(bubble, char.cx, char.cy);
      const to = borderPointToward(char, bubble.x + bubble.w / 2, bubble.y + bubble.h / 2);
      connector.setAttribute('x1', from.x.toFixed(1));
      connector.setAttribute('y1', from.y.toFixed(1));
      connector.setAttribute('x2', to.x.toFixed(1));
      connector.setAttribute('y2', to.y.toFixed(1));
      callout.classList.add('is-on');
      connector.classList.add('is-on');
      shownPersonId = layer.id;
    }

    /**
     * @param {{ delayMs?: number, repositionOnly?: boolean }} [opts]
     */
    function layoutPeopleCallout(layer, avoid, opts = {}) {
      if (!layer || !layer.bounds) {
        hidePeopleCallout();
        return;
      }

      const settling = Boolean(peopleRevealTimer) || pendingPersonId != null;
      const settledOnThis =
        shownPersonId === layer.id &&
        callout.classList.contains('is-on') &&
        !settling;

      // Pointer jitter / same hover: nudge only when fully settled on this person.
      // Never interrupt an in-flight fade-out → fade-in (that was causing pops).
      if (opts.repositionOnly) {
        if (settledOnThis) paintPeopleCallout(layer, avoid);
        return;
      }

      if (settledOnThis) {
        paintPeopleCallout(layer, avoid);
        return;
      }

      // Already animating toward this person - let it finish
      if (pendingPersonId === layer.id && settling) return;

      const token = (peopleShowToken += 1);
      clearPeopleRevealTimer();
      pendingPersonId = layer.id;
      const delayMs = opts.delayMs || 0;
      const wasOn = callout.classList.contains('is-on');

      const reveal = () => {
        if (token !== peopleShowToken) return;
        peopleRevealTimer = 0;
        pendingPersonId = null;
        paintPeopleCallout(layer, avoid);
      };

      const afterFadeOut = () => {
        if (token !== peopleShowToken) return;
        peopleRevealTimer = window.setTimeout(reveal, delayMs);
      };

      // Always fade out first when a plate is up, then fade in the new copy
      if (wasOn) {
        callout.classList.remove('is-on');
        connector.classList.remove('is-on');
        shownPersonId = null;
        peopleRevealTimer = window.setTimeout(afterFadeOut, PEOPLE_FADE_MS);
        return;
      }

      peopleRevealTimer = window.setTimeout(reveal, delayMs);
    }

    const loadbar = document.getElementById('loadbar');
    const loadfill = document.getElementById('loadbar-fill');
    const embed = document.documentElement.classList.contains('embed');
    const totalSteps = 1 + ORIGINS.length + PEOPLE.length;
    let doneSteps = 0;

    function setProgress() {
      doneSteps += 1;
      const pct = Math.min(100, Math.round((doneSteps / totalSteps) * 100));
      if (loadfill) loadfill.style.width = pct + '%';
      if (loadbar) loadbar.setAttribute('aria-valuenow', String(pct));
    }

    function finishProgress() {
      if (loadfill) loadfill.style.width = '100%';
      if (loadbar) {
        loadbar.setAttribute('aria-valuenow', '100');
        loadbar.classList.add('is-done');
        window.setTimeout(() => loadbar.remove(), 480);
      }
      status.textContent = '';
    }

    async function boot() {
      if (!embed) status.textContent = 'Building table/woman occluder mask…';
      const occluderUrl = await buildHoverOccluderMask(TABLE_SRC, WOMAN_SRC);
      hoverStack.style.setProperty('--occluder-mask', `url("${occluderUrl}")`);
      setProgress();

      for (let i = 0; i < ORIGINS.length; i++) {
        const meta = ORIGINS[i];
        if (!embed) status.textContent = `Building origin ${i + 1}/${ORIGINS.length}: ${originLabel(meta)}…`;
        const img = await loadImage(meta.src);
        const el = createHoverLayer(meta.src, 'layer--origin', i + 1, occluderUrl);
        el.dataset.originId = meta.id;
        hoverStack.appendChild(el);
        const mask = buildAlphaMask(img);
        originRuntime.push({
          id: meta.id,
          label: originLabel(meta),
          kicker: originKickerText(meta),
          blurb: originBlurb(meta),
          memberIds: meta.memberIds.slice(),
          bounds: padBounds(mask.bounds),
          el,
          alpha: mask.alpha,
          mw: mask.mw,
          mh: mask.mh,
        });
        setProgress();
      }

      for (let i = 0; i < PEOPLE.length; i++) {
        const meta = PEOPLE[i];
        if (!embed) status.textContent = `Building mask ${i + 1}/${PEOPLE.length}: ${peopleLabel(meta)}…`;
        // Visual = Light art; hit mask = solid non-Light silhouette (no inner holes → no flicker)
        const el = createHoverLayer(meta.src, 'layer--person', 10 + i, occluderUrl);
        el.dataset.id = meta.id;
        hoverStack.appendChild(el);
        const maskImg = await loadImage(meta.maskSrc || meta.src);
        const mask = buildAlphaMask(maskImg);
        fillAlphaInterior(mask.alpha, mask.mw, mask.mh);
        runtime.push({
          id: meta.id,
          originId: meta.originId,
          label: peopleLabel(meta),
          blurb: peopleBlurb(meta),
          el,
          alpha: mask.alpha,
          mw: mask.mw,
          mh: mask.mh,
          bounds: boundsFromAlpha(mask.alpha, mask.mw, mask.mh),
        });
        setProgress();
      }
      finishProgress();
      bindPointer();
    }

    let activePersonId = null;
    let activeOriginId = null;
    let ticking = false;
    let lastX = 0;
    let lastY = 0;

    function sample(layer, nx, ny) {
      const x = Math.min(layer.mw - 1, Math.max(0, (nx * layer.mw) | 0));
      const y = Math.min(layer.mh - 1, Math.max(0, (ny * layer.mh) | 0));
      return layer.alpha[y * layer.mw + x];
    }

    function pointInBounds(nx, ny, b) {
      return b && nx >= b.minX && nx <= b.maxX && ny >= b.minY && ny <= b.maxY;
    }

    function pickPerson(nx, ny) {
      for (let i = runtime.length - 1; i >= 0; i--) {
        const layer = runtime[i];
        if (sample(layer, nx, ny) > ALPHA_THRESHOLD) return layer;
      }
      return null;
    }

    function pickOriginZone(nx, ny) {
      let best = null;
      let bestArea = Infinity;
      for (const o of originRuntime) {
        if (!pointInBounds(nx, ny, o.bounds)) continue;
        const area = (o.bounds.maxX - o.bounds.minX) * (o.bounds.maxY - o.bounds.minY);
        if (area < bestArea) {
          bestArea = area;
          best = o;
        }
      }
      return best;
    }

    function pickHover(clientX, clientY) {
      const rect = stage.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return { person: null, origin: null };
      const nx = (clientX - rect.left) / rect.width;
      const ny = (clientY - rect.top) / rect.height;
      if (nx < 0 || ny < 0 || nx > 1 || ny > 1) return { person: null, origin: null };

      const person = pickPerson(nx, ny);
      if (person) {
        const origin = originRuntime.find((o) => o.id === person.originId) || null;
        return { person, origin };
      }
      return { person: null, origin: pickOriginZone(nx, ny) };
    }

    function setHover(person, origin) {
      const nextPersonId = person ? person.id : null;
      const nextOriginId = origin ? origin.id : null;
      const same = nextPersonId === activePersonId && nextOriginId === activeOriginId;
      activePersonId = nextPersonId;
      activeOriginId = nextOriginId;

      // Origin composite = one merged glow; person layer sits on top when selected
      for (const o of originRuntime) {
        o.el.classList.toggle('is-lit', o.id === nextOriginId);
      }
      for (const L of runtime) {
        L.el.classList.toggle('is-lit', L.id === nextPersonId);
      }

      if (person) hitLabel.textContent = person.label;
      else if (origin) hitLabel.textContent = origin.label;
      else hitLabel.textContent = '-';
      stage.style.cursor = person || origin ? 'pointer' : 'crosshair';

      if (same && person) {
        const { box } = layoutOriginCallout(origin);
        layoutPeopleCallout(person, box, { repositionOnly: true });
        return;
      }
      if (same && !person) {
        layoutOriginCallout(origin);
        hidePeopleCallout();
        return;
      }

      const { box, opened } = layoutOriginCallout(origin);
      if (person) {
        layoutPeopleCallout(person, box, {
          delayMs: opened ? PEOPLE_AFTER_ORIGIN_MS : 0,
        });
      } else {
        hidePeopleCallout();
      }
    }

    function onMove() {
      ticking = false;
      const hit = pickHover(lastX, lastY);
      setHover(hit.person, hit.origin);
    }

    function bindPointer() {
      const embedMode = document.documentElement.classList.contains('embed');
      const requestParentEnter = () => {
        if (!embedMode) return;
        if (!window.parent || window.parent === window) return;
        try {
          window.parent.postMessage({ type: 'tdt-scene-lab', action: 'enter' }, '*');
        } catch (_) { /* ignore */ }
      };

      const tick = (e) => {
        lastX = e.clientX;
        lastY = e.clientY;
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(onMove);
        }
      };
      const isTouch = (e) => e.pointerType === 'touch';
      stage.addEventListener('pointermove', tick, { passive: true });
      stage.addEventListener('pointerdown', (e) => {
        // Phone / first press: ask parent to go immersive (clicks don't bubble out of iframe).
        if (isTouch(e) || (embed && window.matchMedia('(pointer: coarse)').matches)) {
          requestParentEnter();
        }
        tick(e);
      });
      stage.addEventListener('pointerup', (e) => {
        if (!isTouch(e)) return;
        tick(e);
      });
      // A finger lift fires pointerleave. Keep the last tap so the card stays readable.
      stage.addEventListener('pointerleave', (e) => {
        if (isTouch(e)) return;
        setHover(null, null);
      });
      stage.addEventListener('pointercancel', (e) => {
        if (isTouch(e)) return;
        setHover(null, null);
      });
      const onResize = () => {
        syncCalloutScale();
        if (!activePersonId && !activeOriginId) return;
        const person = runtime.find((L) => L.id === activePersonId) || null;
        const origin = originRuntime.find((o) => o.id === activeOriginId) || null;
        const { box } = layoutOriginCallout(origin);
        if (person) layoutPeopleCallout(person, box, { repositionOnly: true });
        else hidePeopleCallout();
      };
      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', () => {
        window.setTimeout(onResize, 120);
      });
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(onResize).observe(stage);
      }
      syncCalloutScale();

      // Standalone /scene-lab/ page (not embed): same immersive behaviour on the stage itself.
      if (!embedMode) {
        const wrap = document.querySelector('.stage-wrap');
        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'scene-lab-close';
        close.hidden = true;
        close.setAttribute('aria-label', 'Close full screen');
        close.innerHTML = '<span aria-hidden="true">×</span>';
        document.body.appendChild(close);
        const hint = document.createElement('p');
        hint.className = 'scene-lab-rotate-hint';
        hint.hidden = true;
        hint.textContent = 'Rotate your phone for the full scene';
        document.body.appendChild(hint);

        let immersive = false;
        const phoneLike = () =>
          window.matchMedia('(pointer: coarse)').matches &&
          window.matchMedia('(max-width: 900px)').matches;

        const enterLocal = async () => {
          if (immersive) return;
          immersive = true;
          document.documentElement.classList.add('scene-lab-local-immersive');
          if (wrap) wrap.classList.add('is-immersive');
          close.hidden = false;
          if (phoneLike()) {
            hint.hidden = false;
            try {
              await (wrap || stage).requestFullscreen?.();
            } catch (_) { /* ignore */ }
            try {
              await screen.orientation?.lock?.('landscape');
            } catch (_) { /* ignore */ }
          }
        };
        const exitLocal = () => {
          if (!immersive) return;
          immersive = false;
          document.documentElement.classList.remove('scene-lab-local-immersive');
          wrap?.classList.remove('is-immersive');
          close.hidden = true;
          hint.hidden = true;
          try { document.exitFullscreen?.(); } catch (_) { /* ignore */ }
          try { screen.orientation?.unlock?.(); } catch (_) { /* ignore */ }
        };
        close.addEventListener('click', exitLocal);
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') exitLocal();
        });
        stage.addEventListener('pointerenter', (e) => {
          if (e.pointerType === 'touch' || phoneLike()) return;
          enterLocal();
        });
        stage.addEventListener('pointerdown', (e) => {
          if (!phoneLike() && e.pointerType !== 'touch') return;
          enterLocal();
        });
      }
    }

    boot().catch((err) => {
      console.error(err);
      status.classList.add('is-error');
      status.textContent = String(err && err.message ? err.message : err);
    });
  </script>
</body>
</html>
