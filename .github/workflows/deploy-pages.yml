# Build the site and deploy to GitHub Pages using the official Pages deployment.
# No gh-pages branch: the site is uploaded as an artifact and deployed by GitHub.
#
# One-time setup: In repo Settings → Pages → Build and deployment → Source,
# choose "GitHub Actions" (not "Deploy from a branch").

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Canonical URLs default to https://www.thediscordingtales.com (tools/site-public-url.js).
      # Optional repo variable SITE_PUBLIC_URL overrides for previews (no trailing slash).
      - name: Build (Vite + play-webllm)
        env:
          SITE_PUBLIC_URL: ${{ vars.SITE_PUBLIC_URL }}
        run: npm run build

      - name: Assemble site for Pages
        run: |
          # Artifact root is publish/ (not site/) - /site/ is the interactive hub URL.
          mkdir -p publish
          cp index.html publish/
          cp -r css publish/
          cp -r assets publish/
          cp -r dist publish/
          [ -d locales ] && cp -r locales publish/ || true
          cp -r public/js publish/
          [ -f public/drd-rules-lore.txt ] && cp public/drd-rules-lore.txt publish/ || true
          cp sitemap.xml publish/
          cp robots.txt publish/
          cp favicon.ico publish/
          cp site.webmanifest publish/
          [ -f sw.js ] && cp sw.js publish/ || true
          # Prevent Jekyll from touching static XML on Pages (avoids odd sitemap behavior)
          touch publish/.nojekyll
          cp 404.html publish/
          cp -r privacy publish/
          cp -r impressum publish/
          cp -r landing publish/
          cp -r site publish/site
          [ -d scene-lab ] && cp -r scene-lab publish/ || true
          # Indexable SEO pages (built by tools/build_seo_*.js during npm run build)
          [ -d lore ] && cp -r lore publish/ || true
          [ -d world ] && cp -r world publish/ || true
          [ -d guide ] && cp -r guide publish/ || true
          [ -d compare ] && cp -r compare publish/ || true
          [ -d character-sheet ] && cp -r character-sheet publish/ || true
          [ -f LICENSE ] && cp LICENSE publish/ || true
          # Google Search Console HTML-file verification (repo root google*.html)
          find . -maxdepth 1 -name 'google*.html' -exec cp -v {} publish/ \;
          # Drop unused multi-MB masters from the Pages artifact (runtime uses .webp)
          rm -f publish/assets/images/Scene/fullscene.jpg || true
          rm -f publish/assets/images/GeocosmosPlain1.jpg || true
          rm -rf publish/assets/images/2022 || true
          # PNG masters superseded by WebP copies in peoples / scene layers
          find publish/assets/images/people -maxdepth 1 -type f -name '*.png' ! -name '*copy*' -delete 2>/dev/null || true
          find publish/assets/images/Scene -maxdepth 1 -type f \( -name 'Yors.png' -o -name 'Yums.png' -o -name 'Beingsts.png' \) -delete 2>/dev/null || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
