# Build the site and deploy to GitHub Pages using the official Pages deployment.
# No gh-pages branch: the site is uploaded as an artifact and deployed by GitHub.
#
# One-time setup: In repo Settings → Pages → Build and deployment → Source,
# choose "GitHub Actions" (not "Deploy from a branch").

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Canonical URLs default to https://www.thediscordingtales.com (tools/site-public-url.js).
      # Optional repo variable SITE_PUBLIC_URL overrides for previews (no trailing slash).
      - name: Build (Vite + play-webllm)
        env:
          SITE_PUBLIC_URL: ${{ vars.SITE_PUBLIC_URL }}
        run: npm run build

      - name: Assemble site for Pages
        run: |
          mkdir -p site
          cp index.html site/
          cp -r css site/
          cp -r assets site/
          cp -r dist site/
          [ -d locales ] && cp -r locales site/ || true
          cp -r public/js site/
          [ -f public/drd-rules-lore.txt ] && cp public/drd-rules-lore.txt site/ || true
          cp sitemap.xml site/
          cp robots.txt site/
          cp favicon.ico site/
          cp site.webmanifest site/
          [ -f sw.js ] && cp sw.js site/ || true
          # Prevent Jekyll from touching static XML on Pages (avoids odd sitemap behavior)
          touch site/.nojekyll
          cp 404.html site/
          [ -f LICENSE ] && cp LICENSE site/ || true
          # Google Search Console HTML-file verification (repo root google*.html)
          find . -maxdepth 1 -name 'google*.html' -exec cp -v {} site/ \;

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
